"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type DictionaryEntry {
  headword: String!
  id: ID!
  kind: DictionaryEntryKind!
  languageTag: String!
  senses: [DictionarySense!]!
}

type DictionaryEntryConnection {
  edges: [DictionaryEntryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DictionaryEntryEdge {
  cursor: String!
  node: DictionaryEntry!
}

"""Whether a dictionary entry is a word or a multiword expression."""
enum DictionaryEntryKind {
  EXPRESSION
  WORD
}

type DictionaryExample {
  id: ID!
  sourceLanguageTag: String!
  sourceText: String!
  translations: [DictionaryExampleTranslation!]!
}

type DictionaryExampleTranslation {
  generatedBy: String
  id: ID!
  languageTag: String!
  text: String!
}

type DictionaryForm {
  id: ID!
  kind: DictionaryFormKind!
  surface: String!
}

enum DictionaryFormKind {
  COMPARATIVE
  OTHER
  PAST
  PAST_PARTICIPLE
  PLURAL
  PRESENT_PARTICIPLE
  SUPERLATIVE
  THIRD_PERSON_SINGULAR
}

"""The grammatical role shared by one dictionary concept."""
enum DictionaryPartOfSpeech {
  ADJECTIVE
  ADVERB
  AUXILIARY
  CONJUNCTION
  DETERMINER
  INTERJECTION
  NOUN
  PARTICLE
  PREPOSITION
  PRONOUN
  VERB
}

type DictionarySense {
  commonnessScore: Float
  examples: [DictionaryExample!]!
  forms: [DictionaryForm!]!
  id: ID!
  narratives: [DictionarySenseNarrative!]!

  """Returns ranked one-hop lexical recommendations for this sense."""
  recommendations(first: Int! = 3): [DictionarySenseRecommendation!]!
  synset: DictionarySynset!
}

type DictionarySenseNarrative {
  generatedBy: String
  id: ID!
  kind: DictionarySenseNarrativeKind!
  languageTag: String!
  markdown: String!
  promptVersion: String
}

enum DictionarySenseNarrativeKind {
  ORIGIN
  STORY
  USAGE_GUIDE
}

type DictionarySenseRecommendation {
  reason: DictionarySenseRecommendationReason!
  targetEntry: DictionaryEntry!
  targetSense: DictionarySense!
}

"""
Why another sense is recommended from this sense's lexical relationships.
"""
enum DictionarySenseRecommendationReason {
  ANTONYM
  CONFUSABLE
  DERIVATIVE
  DERIVED_FROM
  HYPERNYM
  HYPONYM
  RELATED
  SAME_SYNSET
}

type DictionarySynset {
  definitions: [DictionarySynsetDefinition!]!
  examples: [DictionaryExample!]!
  id: ID!
  partOfSpeech: DictionaryPartOfSpeech
}

type DictionarySynsetDefinition {
  id: ID!
  languageTag: String!
  text: String!
}

"""Current operational status of the Wordseed API."""
type HealthStatus {
  """Name of the responding service."""
  service: String!

  """Whether the API can accept requests."""
  status: String!
}

type Mutation {
  """
  Creates the Wordseed user after external authentication, or returns the existing user.
  """
  completeSignIn: User!
}

"""Cursor information for a Relay-compatible connection."""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  """Searches dictionary entries using forward cursor pagination."""
  dictionaryEntries(after: String, first: Int! = 20, languageTag: String! = "en", query: String): DictionaryEntryConnection!

  """Returns one dictionary entry by its stable ID."""
  dictionaryEntry(id: ID!): DictionaryEntry

  """Checks whether the Wordseed API is available."""
  health: HealthStatus!

  """Returns the authenticated Wordseed user, when initialized."""
  me: User
}

"""A Wordseed application user."""
type User {
  createdAt: DateTime!
  id: ID!
  nativeLanguageTag: String
  onboardingCompletedAt: DateTime
  timeZone: String
  updatedAt: DateTime!
}
