"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type DictionaryExample {
  id: ID!
  languageTag: String!
  text: String!
  translations: [DictionaryExampleTranslation!]!
}

type DictionaryExampleTranslation {
  generatedBy: String
  id: ID!
  languageTag: String!
  text: String!
}

type DictionaryForm {
  features: [DictionaryGrammaticalFeature!]!
  id: ID!
  pronunciations: [DictionaryPronunciation!]!
  representations: [DictionaryFormRepresentation!]!
}

type DictionaryFormRepresentation {
  id: ID!
  languageTag: String!
  value: String!
}

type DictionaryGrammaticalFeature {
  id: ID!
  key: String!
  label: String!
}

type DictionaryLanguage {
  code: String!
  defaultScriptCode: String
  id: ID!
  name: String!
}

type DictionaryLemma {
  id: ID!
  isPrimary: Boolean!
  languageTag: String!
  value: String!
}

type DictionaryLexeme {
  canonicalLemma: String!
  forms: [DictionaryForm!]!
  id: ID!
  language: DictionaryLanguage!
  lemmas: [DictionaryLemma!]!
  lexicalCategory: DictionaryLexicalCategory!
  senses: [DictionarySense!]!
}

type DictionaryLexemeConnection {
  edges: [DictionaryLexemeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DictionaryLexemeEdge {
  cursor: String!
  node: DictionaryLexeme!
}

type DictionaryLexicalCategory {
  code: String!
  displayName: String!
  id: ID!
}

type DictionaryPronunciation {
  audioUrl: String
  dialectTag: String
  id: ID!
  ipa: String
  syllabification: String
}

type DictionarySense {
  examples: [DictionaryExample!]!
  glosses: [DictionarySenseGloss!]!
  id: ID!
  narratives: [DictionarySenseNarrative!]!
  order: Int!

  """Returns ranked one-hop lexical recommendations for this sense."""
  recommendations(first: Int! = 3): [DictionarySenseRecommendation!]!
  synset: DictionarySynset
  usages: [DictionarySenseUsage!]!
}

type DictionarySenseGloss {
  id: ID!
  languageTag: String!
  text: String!
}

type DictionarySenseNarrative {
  generatedBy: String
  id: ID!
  kind: DictionarySenseNarrativeKind!
  languageTag: String!
  markdown: String!
  promptVersion: String
}

enum DictionarySenseNarrativeKind {
  ORIGIN
  STORY
  USAGE_GUIDE
}

type DictionarySenseRecommendation {
  reason: DictionarySenseRecommendationReason!
  targetLexeme: DictionaryLexeme!
  targetSense: DictionarySense!
}

enum DictionarySenseRecommendationReason {
  ANTONYM
  CONFUSABLE
  DERIVATIVE
  DERIVED_FROM
  HOLONYM
  HYPERNYM
  HYPONYM
  MERONYM
  RELATED
  SAME_SYNSET
  SYNONYM
  TRANSLATION
}

type DictionarySenseUsage {
  corpus: String
  id: ID!
  rank: Int
  regionTag: String
  register: String
  score: Float
}

type DictionarySynset {
  definitions: [DictionarySynsetDefinition!]!
  id: ID!
}

type DictionarySynsetDefinition {
  id: ID!
  languageTag: String!
  text: String!
}

"""Current operational status of the Wordseed API."""
type HealthStatus {
  """Name of the responding service."""
  service: String!

  """Whether the API can accept requests."""
  status: String!
}

type Mutation {
  """
  Creates the Wordseed user after external authentication, or returns the existing user.
  """
  completeSignIn: User!

  """
  Saves an existing Dictionary Sense once for the authenticated user, preserving its original added time.
  """
  saveDictionarySense(senseId: ID!): SavedLearningItem!
}

"""Cursor information for a Relay-compatible connection."""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  """Returns one dictionary lexeme by its stable ID."""
  dictionaryLexeme(id: ID!): DictionaryLexeme

  """Searches dictionary lexemes using forward cursor pagination."""
  dictionaryLexemes(after: String, first: Int! = 20, languageTag: String! = "en", query: String): DictionaryLexemeConnection!

  """Checks whether the Wordseed API is available."""
  health: HealthStatus!

  """Returns the authenticated Wordseed user, when initialized."""
  me: User

  """
  Lists the authenticated user's saved items by addedAt descending, then ID descending, using forward cursor pagination.
  """
  mySavedLearningItems(after: String, first: Int! = 20): SavedLearningItemConnection!
}

type SavedLearningItem {
  addedAt: DateTime!
  id: ID!
  lexeme: DictionaryLexeme!
  sense: DictionarySense!
}

type SavedLearningItemConnection {
  edges: [SavedLearningItemEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SavedLearningItemEdge {
  cursor: String!
  node: SavedLearningItem!
}

"""A Wordseed application user."""
type User {
  createdAt: DateTime!
  id: ID!
  nativeLanguageTag: String
  onboardingCompletedAt: DateTime
  timeZone: String
  updatedAt: DateTime!
}
